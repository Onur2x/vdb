name: CI

# V3 sertlestirme: cekirdek kapi matrisi (Windows + Linux).
# Ayrinti: docs/engineering/CI.md
#
# MATRIS KAPSAMI (durust kayit): yalniz ubuntu-latest (x86_64) ve
# windows-latest (i386) kosar. macOS ve ARM64 (linux/arm64, windows/arm64)
# icin job YOKTUR cunku bu projede HIC KOSULMADI; "kosmuyor" degil,
# "olculmedi" demektir. Kanitlanmamis platformlari matrise eklemek yesil
# gorunen ama dogrulanmamis bir kapi uretirdi. Bkz.
# docs/audit/V3_ADVANCED_HARDENING_REPORT.md bolum B ve G.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows: sabit Lazarus/FPC surumu (setup-lazarus bu surumu destekliyor).
  # Linux: Ubuntu deposundaki fpc (3.2.2) yeterli; kapilar lazbuild kullanmaz.
  LAZARUS_VERSION: "4.4"

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup FPC / Lazarus (Windows)
        if: runner.os == 'Windows'
        # gcarreno/setup-lazarus v3 (commit'e pinli)
        uses: gcarreno/setup-lazarus@3ee9d77e0c771b37c1069f218cb68bd5ce7c30fe
        with:
          lazarus-version: ${{ env.LAZARUS_VERSION }}
          with-cache: true

      # Linux'ta lazbuild gerekmiyor: tum kapilar saf fpc ile derlenir.
      # Ucuncu-taraf kurulum action'i yerine depo paketi kullanilir; boylece
      # ariza nedeni dogrudan logda gorunur.
      - name: Setup FPC (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -u
          if ! sudo apt-get update > apt-update.log 2>&1; then
            tail -n 30 apt-update.log
            tail -n 5 apt-update.log | while IFS= read -r line; do
              echo "::error::apt-get update: $line"
            done
            exit 1
          fi
          if ! sudo apt-get install -y fpc > apt-install.log 2>&1; then
            tail -n 40 apt-install.log
            tail -n 5 apt-install.log | while IFS= read -r line; do
              echo "::error::apt-get install fpc: $line"
            done
            exit 1
          fi

      - name: Toolchain versions
        shell: bash
        run: |
          fpc -iV
          if command -v lazbuild >/dev/null 2>&1; then
            lazbuild --version | head -n 1
          else
            echo "lazbuild yok (bu platformda gerekmiyor)"
          fi

      - name: Build library projects (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for p in vdbapi vdbcli vdbmig vdbserver; do
            echo "--- $p.lpi"
            lazbuild "$p.lpi" || exit 1
          done

      - name: Build shared library (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash build_lib.sh

      - name: Build and run gates
        shell: bash
        run: |
          set +e
          bash tests/run_gates.sh > gates.out 2>&1
          rc=$?
          cat gates.out
          if [ "$rc" -ne 0 ]; then
            # Basarisiz adimlar check-run anotasyonu olarak da yazilir;
            # boylece log indirme yetkisi olmadan da hata gorulebilir.
            # Derleyici tani satirlari (Error:/Fatal:) de dahil edilir; yalniz
            # "BUILD FAIL <ad>" satiri kok nedeni gostermiyordu.
            grep -E '^(BUILD FAIL|FAIL|MISSING)|Error:|Fatal:' gates.out | head -n 20 |
              while IFS= read -r line; do echo "::error::$line"; done
            tail -n 15 gates.out | while IFS= read -r line; do
              echo "::error::tail: $line"
            done
          fi
          exit "$rc"

      - name: Upload gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ matrix.os }}
          path: |
            build/gates/*.log
            gates.out
            apt-update.log
            apt-install.log
          if-no-files-found: ignore

  # SKILL4 §5: canli PostgreSQL diferansiyeli AYRI bir istir. Varsayilan
  # kapi kosusuna dahil DEGILDIR; PG yoksa veya servis kalkmazsa is
  # "not-run"/SKIP olur ve asla PASS sayilmaz.
  sql_differential_postgres:
    name: sql_differential (live PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vdb
          POSTGRES_PASSWORD: vdb
          POSTGRES_DB: vdb_diff
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vdb
      PGPASSWORD: vdb
      PGDATABASE: vdb_diff
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup FPC (Unix)
        shell: bash
        run: |
          set -u
          sudo apt-get update > apt-update.log 2>&1
          sudo apt-get install -y fpc postgresql-client > apt-install.log 2>&1

      - name: Toolchain versions
        shell: bash
        run: |
          fpc -iV
          psql --version

      - name: Build sql_differential
        shell: bash
        run: |
          mkdir -p build/pg/lib
          fpc -MObjFPC -Scghi -O1 -g -l -vewnhibq -Fu. \
            -FUbuild/pg/lib -FEbuild/pg \
            tests/sql_differential/sql_differential.lpr

      - name: Run live differential
        shell: bash
        run: |
          set +e
          bash tests/sql_differential/run_pg.sh \
            tests/sql_differential/corpus.txt \
            build/pg/sql_differential \
            build/pg/work > pg-run.out 2>&1
          rc=$?
          cat pg-run.out
          if [ "$rc" -eq 77 ]; then
            echo "::warning::canli PostgreSQL kosmadi (SKIP, PASS sayilmaz)"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            grep -E '^FAIL|fark|VDB=|canli PG=' pg-run.out | head -n 30 |
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$rc"

      - name: Upload differential output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-differential-postgres
          path: |
            pg-run.out
            build/pg/work/*.sql
            build/pg/work/pg.out
            build/pg/work/psql.err
          if-no-files-found: ignore
