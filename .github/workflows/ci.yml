name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  schedule:
    # Haftalik rasgele SQL diferansiyeli (M8).
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Lazarus/FPC kur
        timeout-minutes: 12
        run: choco install lazarus --no-progress -y

      - name: lazbuild yolunu bul
        shell: pwsh
        run: |
          $roots = @('C:\tools\lazarus', "$env:ProgramFiles\Lazarus",
            "${env:ProgramFiles(x86)}\Lazarus", 'C:\lazarus')
          $lb = $null
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $lb = Get-ChildItem -Path $r -Filter lazbuild.exe -Recurse `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($lb) { break }
            }
          }
          if (-not $lb) {
            throw 'lazbuild.exe bulunamadi (Lazarus kurulumu basarisiz?)'
          }
          "LAZBUILD=$($lb.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Derle
        timeout-minutes: 12
        shell: pwsh
        run: |
          & $env:LAZBUILD -B sqltest.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B pagechk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B storechk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B heapchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B crashtest.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B idxchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B backendchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B v3sqlchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B migchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sayfa deposu kapisi (storechk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbstorechk'
          $out = & .\storechk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'SAYFA DEPOSU DOGRULANDI') {
            Write-Error 'storechk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'storechk kalan > 0'
            exit 1
          }

      - name: Sayfa cekirdegi kapisi (pagechk)
        shell: pwsh
        run: |
          $out = & .\pagechk.exe 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'SAYFA CEKIRDEGI DOGRULANDI') {
            Write-Error 'pagechk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'pagechk kalan > 0'
            exit 1
          }

      - name: Heap kapisi (heapchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbheapchk'
          $out = & .\heapchk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'HEAP DOGRULANDI') {
            Write-Error 'heapchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'heapchk kalan > 0'
            exit 1
          }

      - name: Cokme kurtarma kapisi (crashtest)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbcrashtest'
          # 2026-10-24: bu adim bir kez 42 dk asili kaldi (bir alt surecte
          # Windows mesaj kutusu). Surec icinde SetErrorMode eklendi; burada
          # ayrica SERT bir sure siniri var ki asilma 45 dk'lik is sinirini
          # yemesin.
          $log = Join-Path $env:RUNNER_TEMP 'crashtest.out'
          $p = Start-Process -FilePath '.\crashtest.exe' -ArgumentList @($dir) `
            -NoNewWindow -PassThru -RedirectStandardOutput $log
          if (-not $p.WaitForExit(300000)) {
            try { $p.Kill() } catch {}
            Write-Host '::error title=crashtest::300 sn icinde bitmedi (asilma)'
            Write-Error 'crashtest zaman asimi'
            exit 1
          }
          $out = Get-Content $log -Raw
          $out | Write-Host
          if ($out -notmatch 'COKME KURTARMA DOGRULANDI') {
            # Log'a erisemeyenler icin son satirlar ANOTASYON olarak yazilir
            # (check-run annotations API'si genel repolarda kimlik dogrulamadan
            # okunabilir).
            $tail = ($out -split "`r?`n" | Where-Object { $_.Trim() -ne '' } |
              Select-Object -Last 25) -join ' || '
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=crashtest::$tail"
            Write-Error 'crashtest basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'crashtest kalan > 0'
            exit 1
          }

      - name: Kalici dizin kapisi (idxchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbidxchk'
          $out = & .\idxchk.exe $dir 50000 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'KALICI DIZIN DOGRULANDI') {
            Write-Error 'idxchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'idxchk kalan > 0'
            exit 1
          }

      - name: Backend dikisi kapisi (backendchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbbackendchk'
          $out = & .\backendchk.exe $dir 5000 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'BACKEND DIKISI DOGRULANDI') {
            Write-Error 'backendchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'backendchk kalan > 0'
            exit 1
          }

      - name: v3 SQL katmani kapisi (v3sqlchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbv3sqlchk'
          $out = & .\v3sqlchk.exe $dir 1200 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'V3 SQL KATMANI DOGRULANDI') {
            Write-Error 'v3sqlchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'v3sqlchk kalan > 0'
            exit 1
          }

      - name: v2 -> v3 goc kapisi (migchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbmigchk'
          $out = & .\migchk.exe $dir 5000 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'V2 -> V3 GOCU DOGRULANDI') {
            Write-Error 'migchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'migchk kalan > 0'
            exit 1
          }

      - name: Testler (tam sqltest + rasgele SQL diferansiyeli)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbtest'
          $out = & .\sqltest.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'TUM SQL TESTLERI GECTI') {
            Write-Error 'sqltest basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'sqltest kalan > 0'
            exit 1
          }

      - name: v3 backend ile SQL kapsam kapisi (sqltest --backend=v3)
        shell: pwsh
        run: |
          # Sprint 2.9: ayni testler v3 sayfa motoru uzerinde kosar. Yalniz
          # v2 motorunun veri dosyasi/WAL/arsiv/SAVEPOINT yollarini kullanan
          # testler ATLA olarak sayilir (sessiz yesil yok: sayi raporlanir).
          $dir = Join-Path $env:RUNNER_TEMP 'vdbtestv3'
          $out = & .\sqltest.exe $dir --backend=v3 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'Backend: v3') {
            Write-Error 'sqltest v3: backend secilemedi'
            exit 1
          }
          if ($out -notmatch 'TUM SQL TESTLERI GECTI') {
            Write-Error 'sqltest v3 basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'sqltest v3 kalan > 0'
            exit 1
          }
          if ($out -notmatch 'atlanan=[1-9]') {
            Write-Error 'sqltest v3: ATLA sayisi beklenmedik (0)'
            exit 1
          }
