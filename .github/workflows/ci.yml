name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  schedule:
    # Haftalik rasgele SQL diferansiyeli (M8).
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Lazarus/FPC kur
        # 12 dk iki kez yetmedi (#30, #34): choco indirmesi altyapi dalgalanmasiyla
        # 12 dakikayi asiyor. Is kendi basina 45 dk sinirli; kurulum icin 30 dk.
        timeout-minutes: 30
        run: choco install lazarus --no-progress -y

      - name: lazbuild yolunu bul
        shell: pwsh
        run: |
          $roots = @('C:\tools\lazarus', "$env:ProgramFiles\Lazarus",
            "${env:ProgramFiles(x86)}\Lazarus", 'C:\lazarus')
          $lb = $null
          foreach ($r in $roots) {
            if (Test-Path $r) {
              $lb = Get-ChildItem -Path $r -Filter lazbuild.exe -Recurse `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($lb) { break }
            }
          }
          if (-not $lb) {
            throw 'lazbuild.exe bulunamadi (Lazarus kurulumu basarisiz?)'
          }
          "LAZBUILD=$($lb.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Derle
        timeout-minutes: 12
        shell: pwsh
        run: |
          & $env:LAZBUILD -B sqltest.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B pagechk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B storechk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B heapchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B crashtest.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B idxchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B backendchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B v3sqlchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B migchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B vdbmig.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B factorychk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B logchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B pitrchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B btreechk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B replchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B lockchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B snapchk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:LAZBUILD -B prochk.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sayfa deposu kapisi (storechk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbstorechk'
          $out = & .\storechk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'SAYFA DEPOSU DOGRULANDI') {
            Write-Error 'storechk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'storechk kalan > 0'
            exit 1
          }

      - name: Sayfa cekirdegi kapisi (pagechk)
        shell: pwsh
        run: |
          $out = & .\pagechk.exe 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'SAYFA CEKIRDEGI DOGRULANDI') {
            Write-Error 'pagechk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'pagechk kalan > 0'
            exit 1
          }

      - name: Heap kapisi (heapchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbheapchk'
          $out = & .\heapchk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'HEAP DOGRULANDI') {
            Write-Error 'heapchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'heapchk kalan > 0'
            exit 1
          }

      - name: Cokme kurtarma kapisi (crashtest)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbcrashtest'
          # 2026-10-24: bu adim bir kez 42 dk asili kaldi (bir alt surecte
          # Windows mesaj kutusu). Surec icinde SetErrorMode eklendi; burada
          # ayrica SERT bir sure siniri var ki asilma 45 dk'lik is sinirini
          # yemesin.
          $log = Join-Path $env:RUNNER_TEMP 'crashtest.out'
          $p = Start-Process -FilePath '.\crashtest.exe' -ArgumentList @($dir) `
            -NoNewWindow -PassThru -RedirectStandardOutput $log
          if (-not $p.WaitForExit(300000)) {
            try { $p.Kill() } catch {}
            Write-Host '::error title=crashtest::300 sn icinde bitmedi (asilma)'
            Write-Error 'crashtest zaman asimi'
            exit 1
          }
          $out = Get-Content $log -Raw
          $out | Write-Host
          if ($out -notmatch 'COKME KURTARMA DOGRULANDI') {
            # Log'a erisemeyenler icin son satirlar ANOTASYON olarak yazilir
            # (check-run annotations API'si genel repolarda kimlik dogrulamadan
            # okunabilir).
            $tail = ($out -split "`r?`n" | Where-Object { $_.Trim() -ne '' } |
              Select-Object -Last 25) -join ' || '
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=crashtest::$tail"
            Write-Error 'crashtest basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'crashtest kalan > 0'
            exit 1
          }

      - name: Kalici dizin kapisi (idxchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbidxchk'
          $out = & .\idxchk.exe $dir 50000 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'KALICI DIZIN DOGRULANDI') {
            Write-Error 'idxchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'idxchk kalan > 0'
            exit 1
          }

      - name: Backend dikisi kapisi (backendchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbbackendchk'
          $out = & .\backendchk.exe $dir 5000 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'BACKEND DIKISI DOGRULANDI') {
            Write-Error 'backendchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'backendchk kalan > 0'
            exit 1
          }

      - name: v3 SQL katmani kapisi (v3sqlchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbv3sqlchk'
          $out = & .\v3sqlchk.exe $dir 1200 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'V3 SQL KATMANI DOGRULANDI') {
            Write-Error 'v3sqlchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'v3sqlchk kalan > 0'
            exit 1
          }

      - name: v2 -> v3 goc kapisi (migchk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbmigchk'
          $out = & .\migchk.exe $dir 5000 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'V2 -> V3 GOCU DOGRULANDI') {
            Write-Error 'migchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'migchk kalan > 0'
            exit 1
          }

      - name: Goc araci kapisi (vdbmig)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbmigchk'
          $src = Join-Path $dir 'mig_src'
          $dst = Join-Path $dir 'cli_dst.odb'
          if (-not (Test-Path (Join-Path $src 'veritabani.odb'))) {
            Write-Error "kaynak yok: $src (migchk adimi once kosmali)"
            exit 1
          }
          $out = & .\vdbmig.exe copy $src $dst 2>&1 | Out-String
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vdbmig copy cikis=$LASTEXITCODE"
            exit 1
          }
          if ($out -notmatch 'TAMAM') {
            Write-Error 'vdbmig copy TAMAM demedi'
            exit 1
          }
          $again = & .\vdbmig.exe copy $src $dst 2>&1 | Out-String
          $again | Write-Host
          if ($LASTEXITCODE -ne 2) {
            Write-Error "var olan hedef reddedilmedi (cikis=$LASTEXITCODE)"
            exit 1
          }
          $vout = & .\vdbmig.exe verify $src $dst 2>&1 | Out-String
          $vout | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vdbmig verify cikis=$LASTEXITCODE"
            exit 1
          }
          if ($vout -notmatch 'TAMAM') {
            Write-Error 'vdbmig verify TAMAM demedi'
            exit 1
          }

      - name: Uygulama giris noktasi kapisi (factorychk)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbfactorychk'
          $out = & .\factorychk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'FACTORY DOGRULANDI') {
            Write-Error 'factorychk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'factorychk kalan > 0'
            exit 1
          }

      - name: Degisim gunlugu kapisi (logchk)
        shell: pwsh
        run: |
          # v4: mantiksal degisim gunlugu bicimi (yazici + okuyucu). Tablo
          # bicimi/kayit alanlari bu kapida denetlenir; bozulma ve yarim grup
          # davranisi dahil.
          $dir = Join-Path $env:RUNNER_TEMP 'vdblogchk'
          $out = & .\logchk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'DEGISIM GUNLUGU DOGRULANDI') {
            Write-Error 'logchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'logchk kalan > 0'
            exit 1
          }

      - name: PITR kapisi (pitrchk)
        shell: pwsh
        run: |
          # v4: taban + ileri replay ile zamana/surume geri okuma; kurtarma
          # dosyasi GERCEK bir veritabani olarak acilip VERIFY edilir.
          $dir = Join-Path $env:RUNNER_TEMP 'vdbpitrchk'
          $out = & .\pitrchk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'PITR DOGRULANDI') {
            Write-Error 'pitrchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'pitrchk kalan > 0'
            exit 1
          }

      - name: B+tree sirali indeks kapisi (btreechk)
        shell: pwsh
        run: |
          # v4: sirali indeksin veri yapisi. Bagimsiz oracle'a karsi tam
          # dogrulama + skiplist ile PARITE. Kapı yalniz karsilastirmayi
          # degil, yapi degismezlerini de denetler (SubCount, ayirici
          # anahtar, yaprak zinciri sirasi).
          $out = & .\btreechk.exe 50000 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'B\+TREE INDEKS DOGRULANDI') {
            Write-Error 'btreechk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'btreechk kalan > 0'
            exit 1
          }

      - name: Replikasyon kapisi (replchk)
        shell: pwsh
        run: |
          # v4: mantiksal gunluk tasima. Iki GERCEK veritabani: birincil
          # (commit'ler) + ikincil (uygulama). KV duzeyinde birebir
          # karsilastirma; bozuk/kesik/bosluklu tasima REDDEDILIR,
          # nesil kopmasi tasinmaz, tekrar uygulama idempotenttir.
          $dir = Join-Path $env:RUNNER_TEMP 'vdbreplchk'
          $out = & .\replchk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'REPLIKASYON DOGRULANDI') {
            Write-Error 'replchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'replchk kalan > 0'
            exit 1
          }

      - name: Cok okuyucu / tek yazici kapisi (lockchk)
        shell: pwsh
        run: |
          # v3.2: iki salt-okunur oturum AYNI ANDA okur; yazar paylasimli
          # kilidi bekler (busy timeout) ve acik "mesgul" hatasi alir;
          # salt-okunur oturum yazamaz, <db>.log olusturmaz, cokme sonrasi
          # WAL katmanindan okur ve diskte HICBIR bayt degistirmez.
          $dir = Join-Path $env:RUNNER_TEMP 'vdblockchk'
          $out = & .\lockchk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'COK OKUYUCU / TEK YAZICI DOGRULANDI') {
            Write-Error 'lockchk basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'lockchk kalan > 0'
            exit 1
          }

      - name: Snapshot isolation kapisi (snapchk)
        shell: pwsh
        run: |
          # v3.15: islem ici okuma goruntusu sabit.
          $dir = Join-Path $env:RUNNER_TEMP 'vdbsnapchk'
          $out = & .\snapchk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'kalan=0') {
            # v3.17: is loglari anonim okunamadigi icin son satirlar ANOTASYON
            # olarak yayinlanir (crashtest adimiyla ayni desen).
            $tail = ($out -split "`r?`n" | Where-Object { $_.Trim() -ne '' } |
              Select-Object -Last 25) -join ' || '
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=snapchk::$tail"
            Write-Error 'snapchk kalan > 0'
            exit 1
          }

      - name: Cok surecli cok yazarlilik kapisi (prochk)
        shell: pwsh
        run: |
          # v3.16: iki GERCEK surec ayni dosyaya yazar;
          # commit edilen satirlarin hicbiri kaybolmaz.
          $dir = Join-Path $env:RUNNER_TEMP 'vdbprochk'
          $out = & .\prochk.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'kalan=0') {
            $tail = ($out -split "`r?`n" | Where-Object { $_.Trim() -ne '' } |
              Select-Object -Last 25) -join ' || '
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Host "::error title=prochk::$tail"
            Write-Error 'prochk kalan > 0'
            exit 1
          }

      - name: Testler (tam sqltest + rasgele SQL diferansiyeli)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vdbtest'
          $out = & .\sqltest.exe $dir 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'TUM SQL TESTLERI GECTI') {
            Write-Error 'sqltest basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'sqltest kalan > 0'
            exit 1
          }

      - name: v3 backend ile SQL kapsam kapisi (sqltest --backend=v3)
        shell: pwsh
        run: |
          # Sprint 2.9: ayni testler v3 sayfa motoru uzerinde kosar. Yalniz
          # v2 motorunun veri dosyasi/WAL/arsiv/SAVEPOINT yollarini kullanan
          # testler ATLA olarak sayilir (sessiz yesil yok: sayi raporlanir).
          $dir = Join-Path $env:RUNNER_TEMP 'vdbtestv3'
          $out = & .\sqltest.exe $dir --backend=v3 2>&1 | Out-String
          $out | Write-Host
          if ($out -notmatch 'Backend: v3') {
            Write-Error 'sqltest v3: backend secilemedi'
            exit 1
          }
          if ($out -notmatch 'TUM SQL TESTLERI GECTI') {
            Write-Error 'sqltest v3 basarisiz'
            exit 1
          }
          if ($out -notmatch 'kalan=0') {
            Write-Error 'sqltest v3 kalan > 0'
            exit 1
          }
          if ($out -notmatch 'atlanan=\d+') {
            Write-Error 'sqltest v3: atlanan sayisi raporlanmadi'
            exit 1
          }

      - name: Ornekler derleniyor (examples/build_all.bat)
        shell: pwsh
        # 2026-10-25: examples/build_all.bat yol hatasi yuzunden 14 ornegin
        # 10'u hic derlenmiyordu ve bu fark edilmedi (eski compile.log'lar
        # hatayi gizliyordu). Ornekler uygulama gelistiricinin BELGESI oldugu
        # icin derlendikleri artik kapida dogrulanir.
        #
        # NOT: Betik interaktif bir "pause" ile biter; bu yuzden CI'da
        # dogrudan kosulmaz, ayni isi yapan adimlar burada kosar.
        run: |
          # fpc'yi lazbuild'in kurulu oldugu agac altinda ara (choco
          # kurulumu: <lazarus>\fpc\<surum>\bin\<hedef>\fpc.exe).
          #
          # ONEMLI: hedef dizini SABIT `i386-win32` ARANMAZ. CI'daki FPC
          # paketi yalniz win64 birimleriyle gelebiliyor (ilk kosuda
          # "fpc.exe bulunamadi (lazRoot=C:\lazarus)" hatasi tam olarak
          # buydu); ornekler kaynak oldugu icin hangi hedefle derlendikleri
          # onemli degil. i386-win32 varsa o tercih edilir (yereldeki
          # davranis aynen korunur), yoksa ilk bulunan fpc kullanilir.
          #
          # Bulunamazsa hata ::error:: ile ANNOTATION olarak yayinlanir
          # (is loglari anonim okunamaz).
          $lazRoot = Split-Path $env:LAZBUILD -Parent
          $cands = @()
          $cands += (Join-Path $lazRoot 'fpc')
          $cands += (Join-Path $lazRoot '..\fpc')
          $cands += 'C:\tools\lazarus\fpc'
          $cands += 'C:\lazarus\fpc'
          $cands += (Join-Path $env:ProgramFiles 'Lazarus\fpc')
          $all = @()
          foreach ($c in $cands) {
            if (-not (Test-Path $c)) { continue }
            $all += @(Get-ChildItem -Path $c -Filter fpc.exe -Recurse `
              -ErrorAction SilentlyContinue)
          }
          $fpcExe = $null
          $pref = $all | Where-Object { $_.FullName -match 'i386-win32' } |
            Select-Object -First 1
          if ($pref) {
            $fpcExe = $pref.FullName
          } elseif ($all.Count -gt 0) {
            $fpcExe = ($all[0]).FullName
          }
          if (-not $fpcExe) {
            $w = & where.exe fpc 2>$null
            if ($LASTEXITCODE -eq 0 -and $w) { $fpcExe = ($w | Select-Object -First 1) }
          }
          if (-not $fpcExe) {
            Write-Host ("::error::fpc.exe bulunamadi (lazRoot=$lazRoot; aday=" +
              ($cands -join ',') + ")")
            exit 1
          }
          Write-Host "FPC=$fpcExe"
          Write-Host ("fpc adaylari: " + $all.Count)

          $units = @('-Fu..', '-Fu..\..', '-Fu..\..\dcpcrypt',
            '-Fu..\..\dcpcrypt\Ciphers', '-Fu..\..\dcpcrypt\Hashes')
          $fail = 0
          # Konsol ornekleri (fpc). 07/08 v2 motorundadir; onlar da derlenir.
          $console = @(
            @('01_basit_kullanim', 'ornek01'),
            @('02_sql_sorgulari', 'ornek02'),
            @('03_crud_islemleri', 'ornek03'),
            @('04_transaction', 'ornek04'),
            @('05_join_islemleri', 'ornek05'),
            @('06_sifreleme', 'ornek06'),
            @('07_tcp_sunucu', 'ornek07'),
            @('08_tcp_istemci', 'ornek08'),
            @('09_json_veri', 'ornek09'),
            @('10_ileri_ozellikler', 'ornek10')
          )
          foreach ($e in $console) {
            $d = Join-Path 'examples' $e[0]
            Push-Location $d
            $o = & $fpcExe -B -Mdelphi @units ($e[1] + '.lpr') 2>&1 | Out-String
            Write-Host $o
            if (-not (Test-Path ($e[1] + '.exe'))) {
              Write-Host ("  FAIL " + $e[0])
              $tail = ($o -split "`r?`n" | Where-Object {
                $_ -match 'Error|Fatal' } | Select-Object -Last 3) -join ' | '
              Write-Host ("::error title=ornek " + $e[0] + "::" + $tail)
              $fail++
            } else { Write-Host ("  OK   " + $e[0]) }
            Pop-Location
          }
          # LCL ornekleri (lazbuild).
          foreach ($e in @(@('11_gui_ornek', 'ornek11'), @('12_milyon_demo', 'ornek12'))) {
            $d = Join-Path 'examples' $e[0]
            Push-Location $d
            $o = & $env:LAZBUILD -B ($e[1] + '.lpi') 2>&1 | Out-String
            Write-Host $o
            if (-not (Test-Path ($e[1] + '.exe'))) {
              Write-Host ("  FAIL " + $e[0])
              $tail = ($o -split "`r?`n" | Where-Object {
                $_ -match 'Error|Fatal' } | Select-Object -Last 3) -join ' | '
              Write-Host ("::error title=ornek " + $e[0] + "::" + $tail)
              $fail++
            } else { Write-Host ("  OK   " + $e[0]) }
            Pop-Location
          }
          if ($fail -gt 0) {
            Write-Host ("::error::ornek derlemesi: " + $fail + " basarisiz")
            exit 1
          }
          Write-Host 'TUM ORNEKLER DERLENDI'
